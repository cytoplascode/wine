<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Built-in AI probe</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 16px; }
  textarea { width: 100%; height: 40vh; font: 13px/1.3 ui-monospace, monospace; }
  button { font: inherit; padding: 10px 14px; }
</style>
<h1>Chrome built-in AI probe</h1>
<p>Open this on the phone, tap Run, then copy the result back into the chat.</p>
<button id="run">Run</button>
<textarea id="out" readonly></textarea>
<script>
  const out = document.getElementById('out');
  document.getElementById('run').onclick = async () => {
    const r = {
      ua: navigator.userAgent,
      LanguageModel: 'LanguageModel' in self,
      legacyAi: !!(self.ai && self.ai.languageModel),
      webgpu: 'gpu' in navigator,
      deviceMemoryGB: navigator.deviceMemory ?? null,
    };
    try {
      if (r.LanguageModel) {
        r.availabilityText = await LanguageModel.availability();
        r.availabilityImage = await LanguageModel.availability({ expectedInputs: [{ type: 'image' }] });
        r.params = await LanguageModel.params?.().catch((e) => String(e));
      }
      if (r.webgpu) {
        const a = await navigator.gpu.requestAdapter();
        r.gpuAdapter = a ? { features: [...a.features], limits: { maxBufferSize: a.limits.maxBufferSize } } : null;
      }
    } catch (e) { r.error = String(e); }
    out.value = JSON.stringify(r, null, 2);
  };
</script>
